name: Validation - PR to Release

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: ["release/*", "release"]

jobs:
  verify-build:
    name: Verify Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Install dependencies
        run: npm ci
      - name: Build Project
        run: npm run build

  unit-tests:
    name: Unit Tests
    needs: verify-build # Asegura esperar a que el build sea exitoso
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Install dependencies
        run: npm ci
      - name: Run Tests & Coverage
        run: npm run test:coverage